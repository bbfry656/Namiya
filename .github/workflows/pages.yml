name: Publish NAMIYA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check content and cloud integration
        run: node --test tests/content.test.cjs tests/cloud.test.cjs tests/sortable.test.cjs tests/layout.test.cjs
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html admin.html style.css admin.css ui.css icons.js upload-ui.js sortable.js layout-geometry.js journal-layout.js site-content.js inline-editor.js reader-editor.js content.js cloud.js cloud-auth.js hero-admin.js stories-admin.js script.js feedback.js stories.json _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
